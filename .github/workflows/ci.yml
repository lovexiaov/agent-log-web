name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck (src)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run example
        run: npx -y tsx example/demo.ts
